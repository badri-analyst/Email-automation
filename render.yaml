services:
  - type: web
    name: ai-outreach-backend
    env: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: PYTHON_BIN
        value: /opt/venv/bin/python
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEARCH_API_KEY
        sync: false
      - key: EMAIL_WRITING_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AIMLAPI_API_KEY
        sync: false
      - key: NVIDIA_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: GMAIL_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
